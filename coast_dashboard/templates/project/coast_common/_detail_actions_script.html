<script>
(function () {
  'use strict';
  // Horizon disables a clicked action button before the form submits, and a
  // disabled button sends no name/value. Row tables add a hidden input; the
  // detail header form does not, so its actions (Redeploy, Start...) posted
  // nothing. Copy the button's action into a hidden input first.
  if (window.coastDetailActionsBound) { return; }
  window.coastDetailActionsBound = true;
  document.addEventListener('click', function (event) {
    var button = event.target.closest &&
      event.target.closest('.detail-actions-form button[name="action"]');
    if (!button || !button.form) { return; }
    var hidden = button.form.querySelector('input[type="hidden"][name="action"]');
    if (!hidden) {
      hidden = document.createElement('input');
      hidden.type = 'hidden';
      hidden.name = 'action';
      button.form.appendChild(hidden);
    }
    hidden.value = button.value;
  }, true);
})();
</script>
