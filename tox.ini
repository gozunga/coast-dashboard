[tox]
minversion = 4.0
envlist = py3,pep8

[testenv]
# horizon and python-coastclient are not installable from requirements.txt
# by pip in CI, so run from the source tree instead of installing.
skip_install = true
setenv =
    PYTHONPATH={toxinidir}
    DJANGO_SETTINGS_MODULE=coast_dashboard.tests.settings
deps = -r{toxinidir}/test-requirements.txt
commands = python manage.py test --parallel auto coast_dashboard.tests {posargs}

[testenv:pep8]
commands = flake8 {posargs}

[testenv:releasenotes]
commands = reno lint

[testenv:docs]
commands = reno lint

[flake8]
exclude = .ai,.venv,.git,.tox,dist,doc,*egg,build,releasenotes
show-source = true
